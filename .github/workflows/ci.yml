name: CI — ArqVértice Studio Quality Gate

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: 🛡️ Strict Quality Gate & Production Pipeline (K14)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Quality Gate 1: Strict Linting & Route Integrity
        run: npm run lint

      - name: 📐 Quality Gate 2: Strict Typechecking & AST Validation
        run: npm run typecheck

      - name: 🧪 Quality Gate 3: Master Automated Test Suite (88 Suites)
        run: npm test

      - name: 🔒 Quality Gate 4: Environment & Security Hardening Verification
        run: |
          npm run test:env
          npm run test:security

      - name: ⚡ Quality Gate 5: Performance Budgets Audit
        run: npm run test:perf

      - name: 🛡️ Quality Gate 6: Dependency Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: 🔑 Quality Gate 7: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🏗️ Quality Gate 8: Production Build Verification
        run: npm run build
