<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Cliente — ArqVértice Studio</title>
  
  <meta name="description" content="Acompanhamento exclusivo e em tempo real do seu projeto arquitetônico.">
  <meta name="author" content="ArqVértice • Arquitetura, Estrutura & Engenharia">
  
  <!-- Fontes: Montserrat & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos Principais e do Portal -->
  <link rel="stylesheet" href="styles.css?v=2.1.0">
  <link rel="stylesheet" href="css/client-portal.css?v=2.1.0">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="margin: 0; padding: 0; background: var(--bg-app, #000000);">

  <!-- Root do Portal do Cliente -->
  <div id="client-portal-root"></div>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/client-portal-module.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.StudioState) {
        window.StudioState.init();
      }
      if (window.ClientPortalModule) {
        window.ClientPortalModule.init();
      }
    });
  </script>
</body>
</html>
