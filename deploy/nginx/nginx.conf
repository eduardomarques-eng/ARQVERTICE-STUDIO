# ==============================================================================
# ARQVERTICE STUDIO — NGINX REVERSE PROXY & CDN EDGE CONFIGURATION
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tipos MIME especializados para 3D e BIM
    types {
        model/gltf-binary                  glb;
        model/gltf+json                    gltf;
        application/octet-stream           sog spz ksplat splat bin ifc;
        image/ktx2                         ktx2;
        image/webp                         webp;
    }

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Otimizações de TCP e Buffer para Uploads Pesados
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml model/gltf+json;

    upstream arqvertice_backend {
        server arqvertice-web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Cabeçalhos Globais de Segurança (OWASP Compliant)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.arqvertice.com; media-src 'self' blob:; connect-src 'self' https://unpkg.com https://api.omniroute.ai http://127.0.0.1:11434 http://127.0.0.1:48080 wss:; frame-ancestors 'self' https://*.arqvertice.com;" always;

        server_tokens off;

        # Bloqueio de métodos HTTP não autorizados (K10)
        if ($request_method ~ ^(TRACE|TRACK|CONNECT)$) {
            return 405;
        }

        # 1. Aplicação Web / HTML Dinâmico (Sem cache de disco)
        location ~* \.(?:html?)$ {
            proxy_pass http://arqvertice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # 2. Manifestos e Metadados do Projeto
        location ~* /(?:api/projects/.*/manifest|project\.manifest\.json)$ {
            proxy_pass http://arqvertice_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # 3. Assets 3D Imutáveis (1 ano de cache imutável)
        location ~* \.(?:glb|gltf|bin|ktx2|sog|spz|ksplat|splat)$ {
            proxy_pass http://arqvertice_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # 4. Demais Rotas e Aplicação
        location / {
            proxy_pass http://arqvertice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
